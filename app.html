<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reelwright — AI Video Studio</title>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#09090f; --canvas:#0d0d16; --pn:#15151f; --pn2:#1c1c29; --ln:#28283a; --ln2:#34344a;
 --tx:#f2f1fa; --mu:#8d8ba8; --mu2:#5f5d7a;
 --v1:#7c5cff; --v2:#ff5c9a; --v3:#ffb84d;
 --grad:linear-gradient(120deg,var(--v1),var(--v2) 55%,var(--v3));
 --ok:#4ade80; --err:#ff6b7a;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Inter",system-ui,sans-serif;background-image:radial-gradient(60% 50% at 85% -10%,rgba(124,92,255,.14),transparent),radial-gradient(40% 40% at 0% 100%,rgba(255,92,154,.08),transparent);background-attachment:fixed}
h1,h2,h3{font-family:"Instrument Serif",Georgia,serif;margin:0;font-weight:400;letter-spacing:-.01em}
h1{font-size:clamp(32px,4.2vw,50px);line-height:1.05}h2{font-size:28px}h3{font-size:19px;font-family:"Inter";font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--pn2);border:1px solid var(--ln2);border-radius:10px;padding:11px 18px;transition:.15s border-color,.15s transform;font-weight:600;font-size:14px}
button:hover{border-color:var(--v1)}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--v1);outline-offset:2px}
button.p{background:var(--grad);border:0;color:#160b2e;font-weight:800;box-shadow:0 8px 24px -8px rgba(124,92,255,.55)}
button.p:hover{filter:brightness(1.07)}
button.ghost{background:none;border-color:transparent;color:var(--mu)}
input,select,textarea{background:var(--canvas);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--ln2)}
textarea{resize:vertical}label{display:block;font-size:13px;color:var(--mu);margin:16px 0 6px;font-weight:500}
#app{display:grid;grid-template-columns:76px 1fr;min-height:100vh}
nav{background:rgba(21,21,31,.6);backdrop-filter:blur(16px);border-right:1px solid var(--ln);padding:18px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:"Instrument Serif";font-size:22px;color:#160b2e;margin-bottom:22px;flex:none}
nav button.nv{width:48px;height:48px;border-radius:12px;border:1px solid transparent;background:none;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--mu);padding:0}
nav button.nv.on{background:var(--pn2);border-color:var(--ln2);color:var(--tx)}
nav button.nv:hover{color:var(--tx)}
.nav-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--pn2);border:1px solid var(--ln2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--v2)}
main{padding:36px 44px 60px;min-width:0;max-width:1180px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:rgba(21,21,31,.72);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:16px;padding:24px}
.canvas{background:var(--canvas);border:1px solid var(--ln);border-radius:20px;padding:28px;position:relative;overflow:hidden}
.canvas::before{content:"";position:absolute;inset:-40% -20% auto -20%;height:60%;background:radial-gradient(ellipse at top,rgba(124,92,255,.18),transparent 70%);pointer-events:none}
.mu{color:var(--mu)}
.chip{display:inline-flex;align-items:center;padding:7px 15px;border:1px solid var(--ln2);border-radius:99px;font-size:13px;margin:0 7px 7px 0;background:var(--canvas);cursor:pointer;font-weight:500}
.chip.on{background:var(--grad);color:#160b2e;border-color:transparent;font-weight:700}
.two{display:grid;grid-template-columns:.95fr 1.3fr;gap:20px;align-items:start}
hr.d{border:0;border-top:1px solid var(--ln);margin:30px 0}
.scene{position:relative;background:var(--pn);border:1px solid var(--ln);border-left:2px solid var(--v1);border-radius:10px;padding:16px 18px;margin-bottom:10px}
.scene .t{font-weight:700;color:var(--tx)}
audio{width:100%;margin-top:8px;height:34px}
video{width:100%;border-radius:14px;background:#000;margin-top:4px;border:1px solid var(--ln)}
.step{display:flex;align-items:center;gap:12px;padding:10px 0}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--canvas);border:1px solid var(--ln2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;color:var(--mu)}
.step.done .n{background:var(--ok);border-color:var(--ok);color:#06331c}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
.gate .card{width:100%;max-width:400px;padding:34px}
.gate .mark{margin:0 auto 18px}
.err{color:var(--err);font-size:13px;margin-top:10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;margin-right:7px;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.pricebox{background:var(--canvas);border:1px solid var(--ln);border-radius:20px;padding:36px;text-align:center;position:relative;overflow:hidden}
.pricebox::before{content:"";position:absolute;inset:-60% -30% auto -30%;height:80%;background:radial-gradient(ellipse at top,rgba(255,92,154,.18),transparent 70%)}
.pricebox .amt{font-family:"Instrument Serif";font-size:58px;color:var(--tx);position:relative}
.pricebox .amt span{font-family:"Inter";font-size:16px;color:var(--mu);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 13px;border-radius:99px;position:relative}
.badge.free{background:var(--pn2);color:var(--mu);border:1px solid var(--ln2)}
.badge.pro{background:var(--grad);color:#160b2e}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:600;font-size:13px}
.stat{font-family:"Instrument Serif";font-size:38px;color:var(--tx)}
.tabs{display:flex;gap:4px;background:var(--canvas);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:4px}
.tabs .chip{margin:0;border-radius:9px;background:none;border:0;flex:1;text-align:center;justify-content:center}
.tabs .chip.on{background:var(--pn2);color:var(--tx)}
@media(max-width:860px){#app{grid-template-columns:1fr}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--ln)}
.mark,.nav-foot{display:none}main{padding:22px 18px 90px}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="root"></div>
<script>
const API="";
const $=(s,r=document)=>r.querySelector(s);
const LANGS=["English","French","Moroccan Darija","Arabic","Spanish","German","Italian","Portuguese","Turkish"];
const DUR=[30,45,60,90,120,180,300];
let S={authed:false,token:"",me:null,authMode:"login",busy:false,err:"",view:"Create",
 topic:"Create a video explaining the history of the pyramids",dur:60,lang:"English",gender:"Female",
 scenes:null,scriptBusy:false,scriptErr:"",videoBusy:false,videoErr:"",videoUrl:"",
 billingBusy:false,billingErr:"",users:[],usersErr:""};

async function api(path,method,body,asBlob){
 const r=await fetch(API+path,{method,headers:{"Content-Type":"application/json",...(S.token?{Authorization:"Bearer "+S.token}:{})},body:body?JSON.stringify(body):undefined});
 if(asBlob){ if(!r.ok){let d=null;try{d=await r.json()}catch(e){} throw new Error((d&&d.detail)||"Request failed ("+r.status+")")} return await r.blob() }
 let d=null;try{d=await r.json()}catch(e){}
 if(!r.ok) throw new Error((d&&d.detail)||"Request failed ("+r.status+")");
 return d}

async function loadMe(){try{S.me=await api("/me","GET")}catch(e){S.authed=false;S.token=""}}

function renderGate(){const su=S.authMode=="signup";return `<div class="gate"><div class="card">
<div class="mark">R</div><h1 style="text-align:center">Reelwright</h1><p class="mu" style="text-align:center;margin:8px 0 20px">Your AI video studio</p>
<div class="tabs"><span class="chip ${!su?"on":""}" role="button" tabindex="0" data-am="login">Log in</span><span class="chip ${su?"on":""}" role="button" tabindex="0" data-am="signup">Sign up</span></div>
${su?`<label>Name</label><input id="gn" placeholder="Your name">`:""}
<label>Email</label><input id="ge" type="email" placeholder="you@example.com">
<label>Password</label><input id="gp" type="password" placeholder="••••••••">
${S.err?`<p class="err">${S.err}</p>`:""}
<button class="p" id="go" style="width:100%;margin-top:18px" ${S.busy?"disabled":""}>${S.busy?'<span class="spin"></span>Please wait':(su?"Create account":"Sign in")}</button>
<p class="mu" style="font-size:12px;margin-top:16px;text-align:center">First call can take ~30s — free hosting waking up.</p>
</div></div>`}

function renderNav(){const items=[["Create","✦"],["Billing","◆"]].concat(S.me&&S.me.role=="admin"?[["Admin","⚙"]]:[]);
 const initial=(S.me&&S.me.name?S.me.name[0]:"U").toUpperCase();
 return `<div class="mark">R</div>`+
 items.map(([n,ic])=>`<button class="nv ${n==S.view?"on":""}" data-v="${n}" title="${n}">${ic}</button>`).join("")+
 `<div class="nav-foot"><div class="avatar" title="${S.me?S.me.email:""}">${initial}</div><button class="ghost nv" id="logout" title="Sign out" style="font-size:15px">⏻</button></div>`}

function chips(list,cur,key){return list.map(x=>`<span class="chip ${x==cur?"on":""}" role="button" tabindex="0" data-k="${key}" data-x="${x}">${x}</span>`).join("")}

function renderCreate(){
 const plan=S.me?S.me.plan:"Free";
 return `<div class="row" style="justify-content:space-between;align-items:flex-start">
  <div><h1>What will you make today?</h1><p class="mu" style="margin-top:6px">Real script, real voice, real video — generated live by AI.</p></div>
  <span class="badge ${plan=='Pro'?'pro':'free'}">${plan=='Pro'?'★ Pro':'Free plan'}</span>
 </div>
 <div class="two" style="margin-top:26px">
  <div class="card">
   <label>Your idea</label>
   <textarea id="topic" rows="3">${S.topic}</textarea>
   <label>Duration</label><div>${chips(DUR.map(String),String(S.dur),"dur")}</div>
   <label>Language</label><select id="lang">${LANGS.map(l=>`<option ${l==S.lang?"selected":""}>${l}</option>`).join("")}</select>
   <label>Narrator voice</label><div>${chips(["Female","Male"],S.gender,"gender")}</div>
   <button class="p" id="genscript" style="margin-top:20px;width:100%" ${S.scriptBusy?"disabled":""}>${S.scriptBusy?'<span class="spin"></span>Writing script…':"Generate script"}</button>
   ${S.scriptErr?`<p class="err">${S.scriptErr}</p>`:""}
   <hr class="d">
   <div class="step ${S.scenes?"done":""}"><span class="n">${S.scenes?"✓":"1"}</span><span class="mu">Claude writes the scene-by-scene script</span></div>
   <div class="step ${S.videoUrl?"done":""}"><span class="n">${S.videoUrl?"✓":"2"}</span><span class="mu">Each scene gets a real AI voice-over</span></div>
   <div class="step ${S.videoUrl?"done":""}"><span class="n">${S.videoUrl?"✓":"3"}</span><span class="mu">Scenes render into one MP4</span></div>
  </div>
  <div class="canvas" style="min-height:420px;display:flex;flex-direction:column">
   ${!S.scenes?`<div style="margin:auto;text-align:center;position:relative">
     <h1 style="color:var(--mu2)">Your video will appear here</h1>
     <p class="mu" style="margin-top:8px">Fill in your idea on the left and generate a script to begin.</p></div>`:
   `<div style="position:relative">
     <h3>Script</h3>
     <div style="margin-top:14px;max-height:${S.videoUrl?"180px":"none"};overflow:auto">
      ${S.scenes.map(s=>`<div class="scene"><span class="t">${s.title}</span> <span class="mu">· ${s.seconds}s</span><p style="margin:8px 0 0">${s.narration}</p></div>`).join("")}
     </div>
     ${!S.videoUrl?`<button class="p" id="genvideo" style="margin-top:14px;width:100%" ${S.videoBusy?"disabled":""}>${S.videoBusy?'<span class="spin"></span>Rendering video — 1–2 minutes…':"Generate full video"}</button>`:""}
     ${S.videoErr?`<p class="err">${S.videoErr}</p>`:""}
     ${S.videoUrl?`<video controls preload="auto" autoplay muted playsinline src="${S.videoUrl}"></video>
      <div class="row" style="margin-top:12px"><a href="${S.videoUrl}" download="reelwright-video.mp4"><button class="p">Download MP4</button></a>
      <button id="again" class="ghost">Make another</button></div>`:""}
    </div>`}
  </div>
 </div>`}

function renderBilling(){const pro=S.me&&S.me.plan=="Pro";
 return `<h1>Billing</h1><p class="mu" style="margin-top:6px">Manage your Reelwright plan.</p>
 <div class="two" style="margin-top:26px;align-items:start">
  <div class="pricebox">
   <span class="badge ${pro?"pro":"free"}" style="position:relative">${pro?"★ Current plan":"Upgrade available"}</span>
   <div class="amt" style="margin-top:14px">$10<span>/month</span></div>
   <h3 style="margin-top:10px">Reelwright Pro</h3>
   <p class="mu">Longer videos, priority rendering, more generations.</p>
   ${pro?`<button disabled style="width:100%;margin-top:18px">You're on Pro ✓</button>`:
     `<button class="p" id="upgrade" style="width:100%;margin-top:18px" ${S.billingBusy?"disabled":""}>${S.billingBusy?'<span class="spin"></span>Loading…':"Upgrade to Pro"}</button>`}
   ${S.billingErr?`<p class="err">${S.billingErr}</p>`:""}
  </div>
  <div class="card"><h3>Free plan</h3><p class="mu" style="margin-top:8px">AI script generation, AI voice-over, video rendering up to 90 seconds, Reelwright watermark.</p>
  <hr class="d"><h3>Pro adds</h3><p class="mu" style="margin-top:8px">Videos up to 10 minutes, no watermark, priority queue.</p></div>
 </div>`}

function renderAdmin(){return `<h1>Admin console</h1><p class="mu" style="margin-top:6px">Signed in as ${S.me.email}</p>
<div class="row" style="gap:14px;margin-top:22px">
 <div class="card" style="flex:1;min-width:140px"><span class="mu">Total users</span><div class="stat">${S.users.length}</div></div>
 <div class="card" style="flex:1;min-width:140px"><span class="mu">Pro users</span><div class="stat">${S.users.filter(u=>u.plan=="Pro").length}</div></div>
 <div class="card" style="flex:1;min-width:140px"><span class="mu">Admins</span><div class="stat">${S.users.filter(u=>u.role=="admin").length}</div></div>
</div>
<hr class="d"><h3>Users</h3>${S.usersErr?`<p class="err">${S.usersErr}</p>`:""}
<div class="card" style="margin-top:14px;padding:8px 20px"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Plan</th><th></th></tr>
${S.users.map(u=>`<tr><td>${u.name}</td><td class="mu">${u.email}</td><td>${u.role}</td><td>${u.plan}</td>
<td><button data-suspend="${u.id}" style="border-color:var(--err);color:var(--err)" class="ghost">${u.role!="admin"?"":""}Suspend</button> ${u.role!="admin"?`<button data-promote="${u.id}" class="ghost">Make admin</button>`:""}</td></tr>`).join("")}
</table></div><button id="refresh-users" class="ghost" style="margin-top:14px">Refresh</button>`}

const V={Create:renderCreate,Billing:renderBilling,Admin:renderAdmin};
function renderApp(){return `<div id="app"><nav>${renderNav()}</nav><main>${V[S.view]()}</main></div>`}
function paint(){$("#root").innerHTML=S.authed?renderApp():renderGate();if(S.authed&&S.view=="Admin"&&!S.users.length)loadUsers()}
function keep(){$("#root").innerHTML=S.authed?renderApp():renderGate()}

async function loadUsers(){try{S.users=await api("/admin/users","GET");S.usersErr=""}catch(e){S.usersErr=e.message}keep()}

document.addEventListener("click", async e=>{
 const t=e.target, d=t.dataset||{};
 if(d.am){S.authMode=d.am;S.err="";paint();return}
 if(t.id=="go"){
  const email=$("#ge").value.trim(), pass=$("#gp").value; S.busy=true; S.err=""; paint();
  try{
   if(S.authMode=="signup") await api("/auth/signup","POST",{name:$("#gn").value.trim()||email,email,password:pass});
   const r=await api("/auth/login","POST",{email,password:pass});
   S.token=r.access_token; S.authed=true; await loadMe();
  }catch(err){S.err=err.message}
  S.busy=false; paint(); return}
 if(t.id=="logout"){S={...S,authed:false,token:"",me:null,scenes:null,videoUrl:""}; paint(); return}
 if(!S.authed) return;
 if(d.v){S.view=d.v; S.err=""; keep(); if(d.v=="Admin") loadUsers(); return}
 if(d.k){const k=d.k,x=d.x; if(k=="dur")S.dur=+x; else S[k]=x; keep(); return}
 if(t.id=="genscript"){
  S.topic=$("#topic").value; S.lang=$("#lang").value;
  S.scriptBusy=true; S.scriptErr=""; S.scenes=null; S.videoUrl=""; keep();
  try{ const r=await api("/ai/script","POST",{topic:S.topic,duration_seconds:S.dur,language:S.lang}); S.scenes=r.scenes; }
  catch(err){S.scriptErr=err.message}
  S.scriptBusy=false; keep(); return}
 if(t.id=="genvideo"){
  S.videoBusy=true; S.videoErr=""; S.videoUrl=""; keep();
  try{
   const blob=await api("/ai/video","POST",{scenes:S.scenes,language:S.lang,gender:S.gender},true);
   S.videoUrl=URL.createObjectURL(blob);
  }catch(err){S.videoErr=err.message}
  S.videoBusy=false; keep(); return}
 if(t.id=="again"){S.scenes=null;S.videoUrl="";keep();return}
 if(t.id=="upgrade"){
  S.billingBusy=true; S.billingErr=""; keep();
  try{
   const cfg=await api("/payments/config","GET");
   Paddle.Environment.set(cfg.environment);
   Paddle.Initialize({token:cfg.client_token, eventCallback:async function(ev){
    if(ev.name=="checkout.completed"){ await loadMe(); S.view="Billing"; keep(); }
   }});
   Paddle.Checkout.open({items:[{priceId:cfg.price_id,quantity:1}],customer:{email:cfg.email},customData:{user_id:String(cfg.user_id)}});
  }catch(err){S.billingErr=err.message}
  S.billingBusy=false; keep(); return}
 if(t.id=="refresh-users"){loadUsers(); return}
 if(d.promote){try{await api("/admin/users/"+d.promote+"/make-admin","POST"); await loadUsers()}catch(err){S.usersErr=err.message; keep()} return}
 if(d.suspend){try{await api("/admin/users/"+d.suspend+"/suspend","POST"); await loadUsers()}catch(err){S.usersErr=err.message; keep()} return}
});
document.addEventListener("keydown", e=>{
 if(e.key=="Enter" && ["gn","ge","gp"].includes(e.target.id)) $("#go").click();
 if((e.key=="Enter"||e.key==" ") && e.target.classList.contains("chip") && e.target.dataset.k){e.preventDefault(); e.target.click()}
});
paint();
</script></body></html>
