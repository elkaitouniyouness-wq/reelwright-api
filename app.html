<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reelwright — AI Video Studio</title>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#171019;--pn:#211823;--pn2:#2b1f2e;--ln:#40323f;--tx:#f4ece8;--mu:#a9939f;--amb:#f2a53c;--cy:#4fc6bd;--rose:#e8607a;--ok:#5cc48a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fbf4ec;--pn:#fff;--pn2:#f3e7da;--ln:#e2d2bf;--tx:#231a15;--mu:#7a6a5d;--amb:#c9741f;--cy:#0e8f86;--rose:#c93b5b;--ok:#1f8a58}}
:root[data-theme="light"]{--bg:#fbf4ec;--pn:#fff;--pn2:#f3e7da;--ln:#e2d2bf;--tx:#231a15;--mu:#7a6a5d;--amb:#c9741f;--cy:#0e8f86;--rose:#c93b5b;--ok:#1f8a58}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;margin:0;letter-spacing:-.01em;font-weight:600}
h1{font-size:clamp(28px,4vw,42px);line-height:1.08}h2{font-size:22px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:10px 16px;transition:border-color .15s}
button:hover{border-color:var(--amb)}button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
button.p{background:var(--amb);border-color:var(--amb);color:#231405;font-weight:700}
button.p:hover{filter:brightness(1.08)}
button.ghost{background:none;border-color:transparent}
input,select,textarea{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;width:100%}
textarea{resize:vertical}label{display:block;font-size:12.5px;color:var(--mu);margin:12px 0 5px;letter-spacing:.02em;text-transform:uppercase}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--pn);border-right:1px solid var(--ln);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.logo{font-family:"Fraunces";font-weight:800;font-size:22px;padding:2px 10px 20px;display:flex;align-items:baseline;gap:5px}
.logo em{font-style:normal;color:var(--amb)}
nav button.nv{text-align:left;border:0;background:none;padding:11px 12px;border-radius:6px;color:var(--mu);border-left:2px solid transparent;font-weight:500}
nav button.nv.on{background:var(--pn2);color:var(--tx);border-left:2px solid var(--amb);font-weight:700}
nav .adm{color:var(--rose)}
.plan-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase}
.plan-badge.free{background:var(--pn2);color:var(--mu);border:1px solid var(--ln)}
.plan-badge.pro{background:linear-gradient(120deg,var(--amb),var(--rose));color:#2a1405}
main{padding:30px 36px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:20px}
.mu{color:var(--mu)}
.chip{display:inline-block;padding:6px 14px;border:1px solid var(--ln);border-radius:99px;font-size:13px;margin:0 6px 6px 0;background:var(--pn);cursor:pointer}
.chip.on{background:var(--amb);color:#231405;border-color:var(--amb);font-weight:700}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
hr.d{border:0;border-top:1px solid var(--ln);margin:26px 0}
.scene{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.scene b{color:var(--amb)}
audio{width:100%;margin-top:8px;height:34px}
video{width:100%;border-radius:8px;background:#000;margin-top:14px}
.step{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--pn2);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.step.done .n{background:var(--ok);border-color:var(--ok);color:#06331c}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate .card{width:100%;max-width:380px}
.gate .logo{justify-content:center;padding-bottom:4px}
.err{color:var(--rose);font-size:13px;margin-top:8px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;margin-right:6px;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.pricebox{background:linear-gradient(145deg,var(--pn2),var(--pn));border:1px solid var(--ln);border-radius:12px;padding:28px;text-align:center}
.pricebox .amt{font-family:"Fraunces";font-size:46px;font-weight:700;color:var(--amb)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500;font-size:12px;text-transform:uppercase}
.stat{font-family:"Fraunces";font-size:30px;font-weight:600}
@media(max-width:860px){#app{grid-template-columns:1fr}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;z-index:5;border-right:0;border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.logo,.nav-foot{display:none}nav button.nv{white-space:nowrap;padding:9px 13px}main{padding:18px 16px 92px}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="root"></div>
<script>
const API="";
const $=(s,r=document)=>r.querySelector(s);
const LANGS=["English","French","Moroccan Darija","Arabic","Spanish","German","Italian","Portuguese","Turkish"];
const DUR=[30,45,60,90,120,180,300];
const fmt=s=>s>=60?Math.floor(s/60)+"m"+(s%60?" "+s%60+"s":""):s+"s";
let S={authed:false,token:"",me:null,authMode:"login",busy:false,err:"",view:"Create",
 topic:"Create a video explaining the history of the pyramids",dur:60,lang:"English",gender:"Female",
 scenes:null,scriptBusy:false,scriptErr:"",videoBusy:false,videoErr:"",videoUrl:"",
 billingBusy:false,billingErr:"",
 users:[],usersErr:""};

async function api(path,method,body,asBlob){
 const r=await fetch(API+path,{method,headers:{"Content-Type":"application/json",...(S.token?{Authorization:"Bearer "+S.token}:{})},body:body?JSON.stringify(body):undefined});
 if(asBlob){ if(!r.ok){let d=null;try{d=await r.json()}catch(e){} throw new Error((d&&d.detail)||"Request failed ("+r.status+")")} return await r.blob() }
 let d=null;try{d=await r.json()}catch(e){}
 if(!r.ok) throw new Error((d&&d.detail)||"Request failed ("+r.status+")");
 return d}

async function loadMe(){try{S.me=await api("/me","GET")}catch(e){S.authed=false;S.token=""}}

function renderGate(){const su=S.authMode=="signup";return `<div class="gate"><div class="card">
<div class="logo">Reel<em>wright</em></div><p class="mu" style="text-align:center;margin:0 0 18px">AI video studio</p>
<div class="row" style="justify-content:center;gap:6px"><span class="chip ${!su?"on":""}" role="button" tabindex="0" data-am="login">Log in</span><span class="chip ${su?"on":""}" role="button" tabindex="0" data-am="signup">Sign up</span></div>
${su?`<label>Name</label><input id="gn" placeholder="Your name">`:""}
<label>Email</label><input id="ge" type="email" placeholder="you@example.com">
<label>Password</label><input id="gp" type="password" placeholder="••••••••">
${S.err?`<p class="err">${S.err}</p>`:""}
<button class="p" id="go" style="width:100%;margin-top:16px" ${S.busy?"disabled":""}>${S.busy?'<span class="spin"></span>Please wait':(su?"Create account":"Sign in")}</button>
<p class="mu" style="font-size:12px;margin-top:14px;text-align:center">First call can take ~30s — free hosting waking up.</p>
</div></div>`}

function renderNav(){const items=[["Create","🎬"],["Billing","💳"]].concat(S.me&&S.me.role=="admin"?[["Admin","🛠️"]]:[]);
 const plan=S.me?S.me.plan:"Free";
 return `<div class="logo">Reel<em>wright</em></div>`+
 items.map(([n])=>`<button class="nv ${n==S.view?"on":""} ${n=="Admin"?"adm":""}" data-v="${n}">${n}</button>`).join("")+
 `<div class="nav-foot" style="margin-top:auto;padding:12px 10px">
  <span class="plan-badge ${plan=="Pro"?"pro":"free"}">${plan=="Pro"?"★ Pro":"Free plan"}</span>
  <p class="mu" style="font-size:12px;margin:10px 0 4px;word-break:break-all">${S.me?S.me.email:""}</p>
  <button class="ghost" id="logout" style="padding:6px 4px">Sign out</button></div>`}

function chips(list,cur,key){return list.map(x=>`<span class="chip ${x==cur?"on":""}" role="button" tabindex="0" data-k="${key}" data-x="${x}">${x}</span>`).join("")}

function renderCreate(){
 return `<h1>What will you make today?</h1><p class="mu">Real AI script, real voice-over, real video — generated live.</p>
 <div class="two" style="margin-top:22px">
  <div class="card">
   <label>Your idea</label>
   <textarea id="topic" rows="3">${S.topic}</textarea>
   <label>Duration</label><div>${chips(DUR.map(String),String(S.dur),"dur")}</div>
   <label>Language</label><select id="lang">${LANGS.map(l=>`<option ${l==S.lang?"selected":""}>${l}</option>`).join("")}</select>
   <label>Narrator voice</label><div>${chips(["Female","Male"],S.gender,"gender")}</div>
   <button class="p" id="genscript" style="margin-top:18px;width:100%" ${S.scriptBusy?"disabled":""}>${S.scriptBusy?'<span class="spin"></span>Writing script…':"① Generate script"}</button>
   ${S.scriptErr?`<p class="err">${S.scriptErr}</p>`:""}
  </div>
  <div class="card">
   <h3>How it works</h3>
   <div class="step ${S.scenes?"done":""}"><span class="n">${S.scenes?"✓":"1"}</span><span>Claude writes a scene-by-scene script</span></div>
   <div class="step ${S.videoUrl?"done":""}"><span class="n">${S.videoUrl?"✓":"2"}</span><span>Each scene gets a real AI voice-over</span></div>
   <div class="step ${S.videoUrl?"done":""}"><span class="n">${S.videoUrl?"✓":"3"}</span><span>Scenes are rendered into one MP4</span></div>
   <p class="mu" style="margin-top:14px;font-size:13px">Rendering a full video can take 1–2 minutes depending on length.</p>
  </div>
 </div>
 ${S.scenes?`<hr class="d"><h2>Script</h2><div style="margin-top:14px">
   ${S.scenes.map((s,i)=>`<div class="scene"><b>${s.title}</b> <span class="mu">· ${s.seconds}s</span><p style="margin:8px 0 0">${s.narration}</p></div>`).join("")}
  </div>
  <button class="p" id="genvideo" style="margin-top:8px" ${S.videoBusy?"disabled":""}>${S.videoBusy?'<span class="spin"></span>Rendering video — this can take a minute or two…':"② Generate full video"}</button>
  ${S.videoErr?`<p class="err">${S.videoErr}</p>`:""}
  ${S.videoUrl?`<video controls preload="auto" autoplay muted playsinline src="${S.videoUrl}"></video><br><a href="${S.videoUrl}" download="reelwright-video.mp4"><button style="margin-top:10px">⬇ Download MP4</button></a>`:""}
 `:""}`}

function renderBilling(){const pro=S.me&&S.me.plan=="Pro";
 return `<h1>Billing</h1><p class="mu">Manage your Reelwright plan.</p>
 <div class="two" style="margin-top:22px;align-items:start">
  <div class="pricebox">
   <span class="plan-badge ${pro?"pro":"free"}">${pro?"★ Current plan":"Upgrade available"}</span>
   <div class="amt">$10<span style="font-size:16px;color:var(--mu)">/month</span></div>
   <h3 style="margin-top:6px">Reelwright Pro</h3>
   <p class="mu">Longer videos, priority rendering, more AI generations.</p>
   ${pro?`<button disabled style="width:100%;margin-top:14px">You're on Pro ✓</button>`:
     `<button class="p" id="upgrade" style="width:100%;margin-top:14px" ${S.billingBusy?"disabled":""}>${S.billingBusy?'<span class="spin"></span>Loading…':"Upgrade to Pro"}</button>`}
   ${S.billingErr?`<p class="err">${S.billingErr}</p>`:""}
  </div>
  <div class="card"><h3>Free plan includes</h3><p class="mu">AI script generation, AI voice-over, video rendering up to 90 seconds, Reelwright watermark.</p>
  <h3 style="margin-top:16px">Pro adds</h3><p class="mu">Videos up to 10 minutes, no watermark, priority queue.</p></div>
 </div>`}

function renderAdmin(){return `<h1>Admin console</h1><p class="mu">Signed in as ${S.me.email} · real data from your API</p>
<div class="row" style="gap:14px;margin-top:18px">
 <div class="card" style="flex:1;min-width:140px"><span class="mu">Total users</span><div class="stat">${S.users.length}</div></div>
 <div class="card" style="flex:1;min-width:140px"><span class="mu">Pro users</span><div class="stat">${S.users.filter(u=>u.plan=="Pro").length}</div></div>
 <div class="card" style="flex:1;min-width:140px"><span class="mu">Admins</span><div class="stat">${S.users.filter(u=>u.role=="admin").length}</div></div>
</div>
<hr class="d"><h2>Users</h2>${S.usersErr?`<p class="err">${S.usersErr}</p>`:""}
<table style="margin-top:10px"><tr><th>Name</th><th>Email</th><th>Role</th><th>Plan</th><th></th></tr>
${S.users.map(u=>`<tr><td>${u.name}</td><td class="mu">${u.email}</td><td>${u.role}</td><td>${u.plan}</td>
<td>${u.role!="admin"?`<button data-promote="${u.id}">Make admin</button>`:""} <button data-suspend="${u.id}" style="border-color:var(--rose);color:var(--rose)">Suspend</button></td></tr>`).join("")}
</table><button id="refresh-users" style="margin-top:12px">Refresh</button>`}

const V={Create:renderCreate,Billing:renderBilling,Admin:renderAdmin};
function renderApp(){return `<div id="app"><nav>${renderNav()}</nav><main>${V[S.view]()}</main></div>`}
function paint(){$("#root").innerHTML=S.authed?renderApp():renderGate();if(S.authed&&S.view=="Admin"&&!S.users.length)loadUsers()}
function keep(){$("#root").innerHTML=S.authed?renderApp():renderGate()}

async function loadUsers(){try{S.users=await api("/admin/users","GET");S.usersErr=""}catch(e){S.usersErr=e.message}keep()}

document.addEventListener("click", async e=>{
 const t=e.target, d=t.dataset||{};
 if(d.am){S.authMode=d.am;S.err="";paint();return}
 if(t.id=="go"){
  const email=$("#ge").value.trim(), pass=$("#gp").value; S.busy=true; S.err=""; paint();
  try{
   if(S.authMode=="signup") await api("/auth/signup","POST",{name:$("#gn").value.trim()||email,email,password:pass});
   const r=await api("/auth/login","POST",{email,password:pass});
   S.token=r.access_token; S.authed=true; await loadMe();
  }catch(err){S.err=err.message}
  S.busy=false; paint(); return}
 if(t.id=="logout"){S={...S,authed:false,token:"",me:null,scenes:null,videoUrl:""}; paint(); return}
 if(!S.authed) return;
 if(d.v){S.view=d.v; S.err=""; keep(); if(d.v=="Admin") loadUsers(); return}
 if(d.k){const k=d.k,x=d.x; if(k=="dur")S.dur=+x; else S[k]=x; keep(); return}
 if(t.id=="genscript"){
  S.topic=$("#topic").value; S.lang=$("#lang").value;
  S.scriptBusy=true; S.scriptErr=""; S.scenes=null; S.videoUrl=""; keep();
  try{ const r=await api("/ai/script","POST",{topic:S.topic,duration_seconds:S.dur,language:S.lang}); S.scenes=r.scenes; }
  catch(err){S.scriptErr=err.message}
  S.scriptBusy=false; keep(); return}
 if(t.id=="genvideo"){
  S.videoBusy=true; S.videoErr=""; S.videoUrl=""; keep();
  try{
   const blob=await api("/ai/video","POST",{scenes:S.scenes,language:S.lang,gender:S.gender},true);
   S.videoUrl=URL.createObjectURL(blob);
  }catch(err){S.videoErr=err.message}
  S.videoBusy=false; keep(); return}
 if(t.id=="upgrade"){
  S.billingBusy=true; S.billingErr=""; keep();
  try{
   const cfg=await api("/payments/config","GET");
   Paddle.Environment.set(cfg.environment);
   Paddle.Initialize({token:cfg.client_token, eventCallback:async function(ev){
    if(ev.name=="checkout.completed"){ await loadMe(); S.view="Billing"; keep(); }
   }});
   Paddle.Checkout.open({items:[{priceId:cfg.price_id,quantity:1}],customer:{email:cfg.email},customData:{user_id:String(cfg.user_id)}});
  }catch(err){S.billingErr=err.message}
  S.billingBusy=false; keep(); return}
 if(t.id=="refresh-users"){loadUsers(); return}
 if(d.promote){try{await api("/admin/users/"+d.promote+"/make-admin","POST"); await loadUsers()}catch(err){S.usersErr=err.message; keep()} return}
 if(d.suspend){try{await api("/admin/users/"+d.suspend+"/suspend","POST"); await loadUsers()}catch(err){S.usersErr=err.message; keep()} return}
});
document.addEventListener("keydown", e=>{
 if(e.key=="Enter" && ["gn","ge","gp"].includes(e.target.id)) $("#go").click();
 if((e.key=="Enter"||e.key==" ") && e.target.classList.contains("chip") && e.target.dataset.k){e.preventDefault(); e.target.click()}
});
paint();
</script></body></html>
